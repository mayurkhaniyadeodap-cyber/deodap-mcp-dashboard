<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- The app has its own light/dark themes: stop the Dark Reader extension from
         re-colouring it (it turned the dark-mode sidebar links unreadable). -->
    <meta name="darkreader-lock" />
    <title>DeoDap MCP Dashboard</title>
    <!-- Saved theme before first paint; a file (not inline) so the strict CSP allows it. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
